<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1e35"/>
      <stop offset="100%" style="stop-color:#1a3a2a"/>
    </linearGradient>
    <linearGradient id="sun1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c04a;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#c9a227;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a5c3a"/>
      <stop offset="100%" style="stop-color:#1a3a22"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#0f1e35;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Sky background -->
  <rect width="1200" height="520" fill="url(#bg1)"/>
  <!-- Glow -->
  <ellipse cx="600" cy="180" rx="520" ry="280" fill="url(#glow1)"/>
  <!-- Ground hills -->
  <ellipse cx="200" cy="560" rx="500" ry="200" fill="url(#hill1)" opacity="0.8"/>
  <ellipse cx="900" cy="580" rx="600" ry="220" fill="#1e4a2a" opacity="0.7"/>
  <rect x="0" y="400" width="1200" height="120" fill="#1a3a22"/>
  <!-- Sun/moon circle -->
  <circle cx="600" cy="185" r="70" fill="url(#sun1)" opacity="0.85"/>
  <circle cx="600" cy="185" r="55" fill="#e8c04a" opacity="0.5"/>
  <!-- Sun rays -->
  <g stroke="#e8c04a" stroke-width="2" opacity="0.35">
    <line x1="600" y1="95" x2="600" y2="65"/>
    <line x1="660" y1="115" x2="682" y2="95"/>
    <line x1="690" y1="185" x2="720" y2="185"/>
    <line x1="660" y1="255" x2="682" y2="275"/>
    <line x1="600" y1="275" x2="600" y2="305"/>
    <line x1="540" y1="255" x2="518" y2="275"/>
    <line x1="510" y1="185" x2="480" y2="185"/>
    <line x1="540" y1="115" x2="518" y2="95"/>
  </g>
  <!-- People silhouettes - group reaching hands -->
  <!-- Person 1 (adult, left) -->
  <circle cx="420" cy="310" r="22" fill="#0f1e35"/>
  <rect x="406" y="332" width="28" height="55" rx="8" fill="#0f1e35"/>
  <!-- reaching arm right -->
  <line x1="434" y1="350" x2="480" y2="340" stroke="#0f1e35" stroke-width="12" stroke-linecap="round"/>
  <!-- Person 2 (child, middle) -->
  <circle cx="510" cy="325" r="16" fill="#c9a227"/>
  <rect x="498" y="341" width="24" height="42" rx="7" fill="#c9a227"/>
  <!-- arm left -->
  <line x1="498" y1="355" x2="465" y2="345" stroke="#c9a227" stroke-width="9" stroke-linecap="round"/>
  <!-- arm right -->
  <line x1="522" y1="355" x2="558" y2="345" stroke="#c9a227" stroke-width="9" stroke-linecap="round"/>
  <!-- Person 3 (adult, right) -->
  <circle cx="600" cy="308" r="24" fill="#3a7d44"/>
  <rect x="585" y="332" width="30" height="58" rx="8" fill="#3a7d44"/>
  <!-- reaching arm left -->
  <line x1="585" y1="352" x2="540" y2="342" stroke="#3a7d44" stroke-width="12" stroke-linecap="round"/>
  <!-- Person 4 (adult far right) -->
  <circle cx="730" cy="315" r="20" fill="#1a4a6a"/>
  <rect x="718" y="335" width="26" height="52" rx="7" fill="#1a4a6a"/>
  <!-- Stars -->
  <circle cx="180" cy="80" r="2" fill="white" opacity="0.6"/>
  <circle cx="350" cy="50" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="820" cy="65" r="2" fill="white" opacity="0.7"/>
  <circle cx="1020" cy="90" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="950" cy="40" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="110" cy="130" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="1100" cy="120" r="2" fill="white" opacity="0.5"/>
  <!-- Trees -->
  <polygon points="100,400 130,300 160,400" fill="#2a5c3a"/>
  <polygon points="115,370 130,280 145,370" fill="#3a7d44"/>
  <rect x="126" y="395" width="8" height="20" fill="#1a3020"/>
  <polygon points="980,400 1010,305 1040,400" fill="#2a5c3a"/>
  <polygon points="995,375 1010,285 1025,375" fill="#3a7d44"/>
  <rect x="1006" y="395" width="8" height="20" fill="#1a3020"/>
  <!-- Text label -->
  <text x="600" y="470" font-family="Georgia, serif" font-size="22" fill="white" text-anchor="middle" opacity="0.9" font-style="italic">Community Outreach</text>
  <text x="600" y="498" font-family="Arial, sans-serif" font-size="14" fill="#c9a227" text-anchor="middle" opacity="0.8">Reaching families across Australia &amp; Kenya</text>
</svg>
