<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2d4f"/>
      <stop offset="100%" stop-color="#0f1e35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#e8c04a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a2d4f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4a2e"/>
      <stop offset="100%" stop-color="#143220"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>

  <!-- Stars -->
  <circle cx="70"  cy="45"  r="1.6" fill="white" opacity="0.45"/>
  <circle cx="190" cy="28"  r="1.3" fill="white" opacity="0.38"/>
  <circle cx="1080" cy="50" r="1.6" fill="white" opacity="0.45"/>
  <circle cx="1160" cy="28" r="1.3" fill="white" opacity="0.50"/>

  <!-- Floor -->
  <rect x="0" y="370" width="1200" height="110" fill="#08131f" opacity="0.85"/>
  <line x1="0" y1="370" x2="1200" y2="370" stroke="#1e3a58" stroke-width="1.5" opacity="0.65"/>

  <!-- Chalkboard -->
  <rect x="280" y="80" width="640" height="270" rx="14" fill="url(#board)"/>
  <rect x="292" y="92"  width="616" height="246" rx="10" fill="#1a4228"/>
  <rect x="280" y="78"  width="640" height="274" rx="14" fill="none" stroke="#c9a227" stroke-width="3" opacity="0.65"/>

  <!-- Board decorations — chalk writing -->
  <text x="600" y="158" font-family="Georgia, serif" font-size="28" fill="white"
        text-anchor="middle" opacity="0.85" font-style="italic">"Every mind matters."</text>
  <line x1="330" y1="178" x2="870" y2="178" stroke="white" stroke-width="1" opacity="0.20"/>

  <!-- Equation -->
  <text x="390" y="220" font-family="Arial" font-size="17" fill="#e8c04a" opacity="0.80">Skills</text>
  <text x="488" y="220" font-family="Arial" font-size="17" fill="white"    opacity="0.45">+</text>
  <text x="518" y="220" font-family="Arial" font-size="17" fill="#4e9e5a"  opacity="0.80">Opportunity</text>
  <text x="698" y="220" font-family="Arial" font-size="17" fill="white"    opacity="0.45">=</text>
  <text x="728" y="220" font-family="Arial" font-size="17" fill="#e8c04a"  opacity="0.80">Freedom</text>
  <line x1="330" y1="238" x2="870" y2="238" stroke="white" stroke-width="1" opacity="0.12"/>

  <!-- ABC row -->
  <text x="460" y="288" font-family="Arial" font-size="24" fill="white" opacity="0.22" letter-spacing="22">A  B  C  D</text>

  <!-- Light-bulb above board -->
  <circle cx="600" cy="58" r="11" fill="#e8c04a" opacity="0.75"/>
  <line   x1="600" y1="69" x2="600" y2="80" stroke="#c9a227" stroke-width="2.5"/>
  <!-- cord -->
  <line   x1="600" y1="80" x2="600" y2="90" stroke="#c9a227" stroke-width="1.5" opacity="0.5"/>

  <!-- Teacher -->
  <circle cx="600" cy="67" r="0"/> <!-- anchor -->
  <!-- teacher stands just left of board left edge -->
  <circle cx="234" cy="285" r="18" fill="#1a2d4f" stroke="#c9a227" stroke-width="2.2"/>
  <rect   x="222" y="303" width="24" height="40" rx="6" fill="#1a2d4f" stroke="#c9a227" stroke-width="1.8"/>
  <!-- pointing arm -->
  <line x1="246" y1="316" x2="282" y2="310" stroke="#c9a227" stroke-width="4" stroke-linecap="round"/>

  <!-- Left desk + student -->
  <rect x="60"  y="335" width="190" height="12" rx="4" fill="#2a4a6a"/>
  <rect x="100" y="347" width="10"  height="38" fill="#1e3a58"/>
  <rect x="220" y="347" width="10"  height="38" fill="#1e3a58"/>
  <circle cx="152" cy="304" r="20" fill="#c9a227" opacity="0.90"/>
  <rect   x="136" y="324" width="32" height="28" rx="6" fill="#c9a227" opacity="0.80"/>
  <rect   x="105" y="323" width="60" height="13" rx="3" fill="white" opacity="0.55"/>

  <!-- Right desk + student -->
  <rect x="950"  y="335" width="190" height="12" rx="4" fill="#2a4a6a"/>
  <rect x="990"  y="347" width="10"  height="38" fill="#1e3a58"/>
  <rect x="1110" y="347" width="10"  height="38" fill="#1e3a58"/>
  <circle cx="1042" cy="304" r="20" fill="#3a7d44" opacity="0.90"/>
  <rect   x="1026" y="324" width="32" height="28" rx="6" fill="#3a7d44" opacity="0.80"/>
  <rect   x="995"  y="323" width="60" height="13" rx="3" fill="white" opacity="0.55"/>
</svg>
