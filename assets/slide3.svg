<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2a3a"/>
      <stop offset="100%" style="stop-color:#1a2d4f"/>
    </linearGradient>
    <radialGradient id="sunrise" cx="50%" cy="80%" r="80%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:0.3"/>
      <stop offset="60%" style="stop-color:#3a7d44;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0f2a3a;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg3)"/>
  <rect x="0" y="0" width="1200" height="520" fill="url(#sunrise)"/>
  <!-- Ground -->
  <ellipse cx="600" cy="520" rx="900" ry="160" fill="#1a3a22" opacity="0.6"/>
  <rect x="0" y="410" width="1200" height="110" fill="#1a3020" opacity="0.5"/>
  <!-- Rainbow arc -->
  <path d="M 150 450 Q 600 50 1050 450" fill="none" stroke="#e8c04a" stroke-width="6" opacity="0.15"/>
  <path d="M 190 450 Q 600 100 1010 450" fill="none" stroke="#4e9e5a" stroke-width="5" opacity="0.12"/>
  <path d="M 230 450 Q 600 150 970 450" fill="none" stroke="#2a6a8a" stroke-width="4" opacity="0.10"/>
  <!-- Large heart shape -->
  <path d="M 600 280 C 600 280 490 200 490 150 C 490 110 520 90 560 100 C 580 105 600 125 600 125 C 600 125 620 105 640 100 C 680 90 710 110 710 150 C 710 200 600 280 600 280 Z" fill="#c9a227" opacity="0.25"/>
  <!-- Children silhouettes - playing -->
  <!-- Child 1 jumping -->
  <circle cx="350" cy="295" r="18" fill="#e8c04a"/>
  <rect x="338" y="313" width="24" height="35" rx="7" fill="#e8c04a" opacity="0.9"/>
  <!-- arms up -->
  <line x1="338" y1="320" x2="315" y2="300" stroke="#e8c04a" stroke-width="9" stroke-linecap="round"/>
  <line x1="362" y1="320" x2="385" y2="300" stroke="#e8c04a" stroke-width="9" stroke-linecap="round"/>
  <!-- legs apart (jumping) -->
  <line x1="344" y1="348" x2="330" y2="380" stroke="#e8c04a" stroke-width="9" stroke-linecap="round"/>
  <line x1="358" y1="348" x2="372" y2="380" stroke="#e8c04a" stroke-width="9" stroke-linecap="round"/>
  <!-- Child 2 standing -->
  <circle cx="500" cy="300" r="16" fill="#4e9e5a"/>
  <rect x="488" y="316" width="24" height="38" rx="6" fill="#4e9e5a" opacity="0.9"/>
  <line x1="488" y1="326" x2="468" y2="340" stroke="#4e9e5a" stroke-width="8" stroke-linecap="round"/>
  <line x1="512" y1="326" x2="532" y2="318" stroke="#4e9e5a" stroke-width="8" stroke-linecap="round"/>
  <line x1="494" y1="354" x2="488" y2="385" stroke="#4e9e5a" stroke-width="8" stroke-linecap="round"/>
  <line x1="506" y1="354" x2="512" y2="385" stroke="#4e9e5a" stroke-width="8" stroke-linecap="round"/>
  <!-- Child 3 centre -->
  <circle cx="620" cy="288" r="20" fill="#c9a227"/>
  <rect x="607" y="308" width="26" height="40" rx="7" fill="#c9a227" opacity="0.9"/>
  <line x1="607" y1="318" x2="583" y2="308" stroke="#c9a227" stroke-width="9" stroke-linecap="round"/>
  <line x1="633" y1="318" x2="657" y2="308" stroke="#c9a227" stroke-width="9" stroke-linecap="round"/>
  <line x1="613" y1="348" x2="607" y2="382" stroke="#c9a227" stroke-width="9" stroke-linecap="round"/>
  <line x1="627" y1="348" x2="633" y2="382" stroke="#c9a227" stroke-width="9" stroke-linecap="round"/>
  <!-- Child 4 -->
  <circle cx="760" cy="298" r="17" fill="#1a6a8a"/>
  <rect x="748" y="315" width="24" height="36" rx="6" fill="#1a6a8a" opacity="0.9"/>
  <line x1="748" y1="325" x2="728" y2="315" stroke="#1a6a8a" stroke-width="8" stroke-linecap="round"/>
  <line x1="772" y1="325" x2="792" y2="335" stroke="#1a6a8a" stroke-width="8" stroke-linecap="round"/>
  <line x1="754" y1="351" x2="748" y2="384" stroke="#1a6a8a" stroke-width="8" stroke-linecap="round"/>
  <line x1="766" y1="351" x2="772" y2="384" stroke="#1a6a8a" stroke-width="8" stroke-linecap="round"/>
  <!-- Child 5 -->
  <circle cx="880" cy="305" r="15" fill="#3a7d44"/>
  <rect x="869" y="320" width="22" height="34" rx="6" fill="#3a7d44" opacity="0.9"/>
  <line x1="869" y1="330" x2="850" y2="322" stroke="#3a7d44" stroke-width="7" stroke-linecap="round"/>
  <line x1="891" y1="330" x2="910" y2="322" stroke="#3a7d44" stroke-width="7" stroke-linecap="round"/>
  <line x1="875" y1="354" x2="869" y2="384" stroke="#3a7d44" stroke-width="7" stroke-linecap="round"/>
  <line x1="886" y1="354" x2="892" y2="384" stroke="#3a7d44" stroke-width="7" stroke-linecap="round"/>
  <!-- Stars -->
  <circle cx="100" cy="80" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="250" cy="45" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="900" cy="70" r="2" fill="white" opacity="0.6"/>
  <circle cx="1100" cy="50" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="1050" cy="120" r="1.5" fill="white" opacity="0.4"/>
  <!-- Kite -->
  <polygon points="680,130 700,170 680,200 660,170" fill="#c9a227" opacity="0.5"/>
  <line x1="680" y1="200" x2="700" y2="280" stroke="#c9a227" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
  <!-- Caption -->
  <text x="600" y="458" font-family="Georgia, serif" font-size="22" fill="white" text-anchor="middle" opacity="0.9" font-style="italic">Supporting Children &amp; Families</text>
  <text x="600" y="488" font-family="Arial, sans-serif" font-size="14" fill="#c9a227" text-anchor="middle" opacity="0.8">Every child deserves safety, love, and the chance to thrive</text>
</svg>
