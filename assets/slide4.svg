<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1e35"/>
      <stop offset="50%"  stop-color="#1a2d4f"/>
      <stop offset="100%" stop-color="#1a3a22"/>
    </linearGradient>
    <radialGradient id="dawn" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#e8c04a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0f1e35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5a" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#08121e" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="figure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c04a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#dawn)"/>

  <!-- Stars -->
  <circle cx="100"  cy="45"  r="1.8" fill="white" opacity="0.50"/>
  <circle cx="270"  cy="28"  r="1.4" fill="white" opacity="0.40"/>
  <circle cx="880"  cy="40"  r="1.8" fill="white" opacity="0.50"/>
  <circle cx="1080" cy="55"  r="1.4" fill="white" opacity="0.42"/>
  <circle cx="1160" cy="28"  r="1.8" fill="white" opacity="0.55"/>
  <circle cx="200"  cy="90"  r="1.2" fill="white" opacity="0.28"/>
  <circle cx="960"  cy="82"  r="1.2" fill="white" opacity="0.28"/>

  <!-- Dawn sun -->
  <circle cx="600" cy="290" r="52" fill="#c9a227" opacity="0.18"/>
  <circle cx="600" cy="290" r="36" fill="#e8c04a" opacity="0.24"/>
  <circle cx="600" cy="290" r="22" fill="#e8c04a" opacity="0.32"/>

  <!-- Water / river -->
  <rect x="0" y="320" width="1200" height="90" fill="url(#water)" opacity="0.80"/>
  <!-- Water reflection of dawn -->
  <ellipse cx="600" cy="348" rx="160" ry="22" fill="#c9a227" opacity="0.14"/>
  <!-- Ripples -->
  <ellipse cx="280" cy="342" rx="90" ry="8" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.16"/>
  <ellipse cx="920" cy="350" rx="110" ry="9" fill="none" stroke="white" stroke-width="1" opacity="0.10"/>

  <!-- Ground on both banks -->
  <rect x="0"    y="310" width="380" height="60" fill="#1a3020" opacity="0.85"/>
  <rect x="820"  y="310" width="380" height="60" fill="#1a3020" opacity="0.85"/>
  <rect x="0"    y="410" width="1200" height="70" fill="#0a1408" opacity="0.70"/>

  <!-- Bridge cables (vertical) -->
  <g stroke="#1a3a58" stroke-width="1.8" opacity="0.65">
    <line x1="320" y1="200" x2="320" y2="318"/>
    <line x1="400" y1="170" x2="400" y2="318"/>
    <line x1="490" y1="150" x2="490" y2="318"/>
    <line x1="600" y1="144" x2="600" y2="318"/>
    <line x1="710" y1="150" x2="710" y2="318"/>
    <line x1="800" y1="170" x2="800" y2="318"/>
    <line x1="880" y1="200" x2="880" y2="318"/>
  </g>

  <!-- Bridge arch — gold -->
  <path d="M 200 318 Q 600 110 1000 318" fill="none" stroke="#c9a227" stroke-width="5.5" opacity="0.88"/>

  <!-- Bridge deck -->
  <rect x="170" y="316" width="860" height="16" rx="4" fill="#2a4a6a"/>
  <rect x="170" y="316" width="860" height="4"  rx="2" fill="#3a6a8a" opacity="0.6"/>

  <!-- Bridge pillars -->
  <rect x="295" y="316" width="20" height="80" fill="#1a3a58" rx="2"/>
  <rect x="885" y="316" width="20" height="80" fill="#1a3a58" rx="2"/>

  <!-- Person walking across bridge -->
  <circle cx="575" cy="278" r="18" fill="url(#figure)"/>
  <rect   x="563" y="296" width="24" height="40" rx="7" fill="url(#figure)"/>
  <!-- forward leg -->
  <line x1="569" y1="336" x2="557" y2="372" stroke="#c9a227" stroke-width="11" stroke-linecap="round"/>
  <!-- back leg -->
  <line x1="581" y1="336" x2="592" y2="372" stroke="#c9a227" stroke-width="11" stroke-linecap="round"/>
  <!-- arm swinging forward -->
  <line x1="587" y1="308" x2="612" y2="322" stroke="#e8c04a" stroke-width="9" stroke-linecap="round"/>
  <!-- shadow on bridge deck -->
  <ellipse cx="575" cy="374" rx="16" ry="4" fill="black" opacity="0.18"/>

  <!-- Birds -->
  <path d="M 380 138 Q 392 128 404 138" fill="none" stroke="white" stroke-width="2" opacity="0.55"/>
  <path d="M 415 122 Q 428 112 441 122" fill="none" stroke="white" stroke-width="2" opacity="0.48"/>
  <path d="M 760 130 Q 773 120 786 130" fill="none" stroke="white" stroke-width="2" opacity="0.55"/>
  <path d="M 800 112 Q 812 103 824 112" fill="none" stroke="white" stroke-width="2" opacity="0.42"/>
  <path d="M 440 105 Q 450 97  460 105" fill="none" stroke="white" stroke-width="1.5" opacity="0.35"/>
</svg>
